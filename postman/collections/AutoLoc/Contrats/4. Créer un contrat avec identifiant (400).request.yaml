$kind: http-request
url: "{{baseUrl}}/contrats"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "idContrat": 5,
        "dateSignature": "2026-11-02",
        "montantTotal": 480.00,
        "valide": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 4000
