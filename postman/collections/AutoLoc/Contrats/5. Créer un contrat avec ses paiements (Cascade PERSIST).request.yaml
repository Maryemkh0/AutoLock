$kind: http-request
url: "{{baseUrl}}/contrats"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "dateSignature": "2026-11-02",
        "montantTotal": 480.00,
        "valide": true,
        "paiements": [
            {
                "montant": 150.00,
                "datePaiement": "2026-11-02",
                "modePaiement": "CARTE"
            },
            {
                "montant": 330.00,
                "datePaiement": "2026-11-06",
                "modePaiement": "VIREMENT"
            }
        ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201 Created", function () {
          pm.response.to.have.status(201);
      });
      var jsonData = pm.response.json();
      pm.environment.set("contratCascadeId", jsonData.idContrat);
    language: text/javascript
order: 5000
